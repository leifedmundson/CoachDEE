<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Coach DEE</title>
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="13"/></clipPath>
    <!-- the D is cut out of the sea: white keeps, black removes -->
    <mask id="d-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <path fill="#000000" fill-rule="evenodd"
            d="M24.3 40.5 H30.8 A9.4 10 0 0 1 30.8 60.5 H24.3 Z
               M29.7 45.3 V55.7 A4.4 5.2 0 0 0 29.7 45.3 Z"/>
    </mask>
  </defs>
  <g clip-path="url(#tile)">
  <g mask="url(#d-cutout)">
    <!-- sun: Warm Yellow with an Antique Gold ring -->
    <circle cx="32" cy="27" r="20.5" fill="#E9C75E" stroke="#C49A59" stroke-width="2.4"/>
    <!-- mountains: sage, two simple ranges -->
    <path d="M-2 39 L9 30 L14 33 L20 27.5 L29 37 L35 39 Z" fill="#748479"/>
    <path d="M30 39 L40 31 L45 34 L52 28.5 L66 39 Z" fill="#748479"/>
    <!-- sea: Deep Blue-Teal (the D is cut through everything) -->
    <path d="M-2 38.5 Q8 36.6 16 38.3 T32 38.3 T48 38.3 T66 38.3 V66 H-2 Z" fill="#183D48"/>
  </g>
  </g>
</svg>
